name: Harbuu Bakery Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Notice
        run: |
          echo "========================================="
          echo "🚀 Deploying Harbuu Bakery to ${{ github.event.inputs.environment || 'production' }}..."
          echo "========================================="

