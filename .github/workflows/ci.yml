name: Harbuu Bakery CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 1. Go Backend: Lint, Test, & Cross-Platform Build
  # -----------------------------------------------------------
  backend:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Go Tests with Coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Build Linux Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../bin
          go build -ldflags="-s -w" -o ../bin/harbuu-backend-linux-amd64 main.go

      - name: Build Windows Binary
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p ../bin
          go build -ldflags="-s -w" -o ../bin/harbuu-backend-windows-amd64.exe main.go

      - name: Upload Backend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: bin/
          retention-days: 7

  # -----------------------------------------------------------
  # 2. React + Vite Frontend: Install, Typecheck, & Build
  # -----------------------------------------------------------
  frontend:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/
          retention-days: 7

  # -----------------------------------------------------------
  # 3. Pipeline Health & Integration Summary
  # -----------------------------------------------------------
  pipeline-success:
    name: CI Pipeline Status Check
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline Verified
        run: |
          echo "========================================="
          echo "🎉 Harbuu Bakery CI Pipeline Succeeded!"
          echo "✅ Backend (Go) & Frontend (Vite) verified."
          echo "========================================="
