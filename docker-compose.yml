services:
  mongodb:
    image: mongo:7.0
    container_name: bakery_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=harbuu_bakery
    volumes:
      - bakery_mongo_data:/data/db
    networks:
      - bakery-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bakery_backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=harbuu_bakery
      - GIN_MODE=release
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bakery-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bakery_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bakery-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  bakery_mongo_data:
    driver: local

networks:
  bakery-net:
    driver: bridge
